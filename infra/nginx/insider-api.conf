# Nginx reverse proxy for the Insider API (127.0.0.1:8000).
# Install:
#   sudo cp infra/nginx/insider-api.conf /etc/nginx/sites-available/insider-api.conf
#   sudo ln -s ../sites-available/insider-api.conf /etc/nginx/sites-enabled/
#   edit server_name, then: sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.insider.example.com   # adds the 443 server + redirect

upstream insider_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.insider.example.com;  # CHANGE ME

    # Ingest batches carry up to 500 messages (text up to 64 KiB each).
    # Media goes straight to GCS through signed URLs, not through here.
    client_max_body_size 32m;

    access_log /var/log/nginx/insider-api.access.log;
    error_log  /var/log/nginx/insider-api.error.log;

    location / {
        proxy_pass http://insider_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://insider_api;
        access_log off;
    }
}
